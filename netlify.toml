# XTask Frontend · Netlify
# Demo gratuito: frontend acá, backend en Render (free), Postgres en Neon (free).
#
# Antes del primer deploy:
#   1. Cambiar VITE_API_URL en los context.* por la URL real de Render.
#      Ejemplo: https://xtask-api.onrender.com/api
#   2. (Opcional) overridear en Netlify Dashboard → Site settings →
#      Environment variables — ese valor pisa el de aquí.

[build]
  base    = "Frontend_Xtask"
  command = "npm ci && npm run build"
  publish = "Frontend_Xtask/dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA routing ──────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    # CSP permite API en *.onrender.com y fonts Google
    Content-Security-Policy   = "default-src 'self'; connect-src 'self' https://*.onrender.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Deploy contexts ──────────────────────────────────────────────
# Vite lee VITE_API_URL en build time. Apuntá directo a Render
# (más simple y CORS configurado en backend).

[context.production.environment]
  VITE_ENV     = "production"
  VITE_API_URL = "https://xtask-api.onrender.com/api"

[context.deploy-preview.environment]
  VITE_ENV     = "preview"
  VITE_API_URL = "https://xtask-api.onrender.com/api"

[context.branch-deploy.environment]
  VITE_ENV     = "staging"
  VITE_API_URL = "https://xtask-api.onrender.com/api"
