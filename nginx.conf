server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ──────────────────────────────────────────────────────────────
    # Cache strategy:
    #  - index.html SIEMPRE revalida (no-cache) → el browser detecta nuevos builds
    #  - assets hasheados por Vite (/assets/*.{js,css}) son immutables 1 año
    # ──────────────────────────────────────────────────────────────

    # index.html y favicon — never cache aggressively
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /favicon.svg {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Assets versionados por Vite (con hash en el nombre) → immutables
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Static assets sueltos en root (favicon, robots, etc) → cache corto
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA routing — todo path desconocido cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html no se cachea
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API requests to backend gateway
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't buffer streaming responses (futuro chat con SSE)
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
